name: Idea or wish
description: A new game, a change that would make it more fun or easier to use.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Issues are **public**: please don't include names, ages, or medical details.
  - type: textarea
    id: what
    attributes:
      label: What would you like?
      description: What would make it better, and why?
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Which game or page? (if any)
